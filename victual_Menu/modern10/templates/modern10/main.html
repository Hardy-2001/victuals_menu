{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Corex Modern10 Auto Matrix — Premium Car Rentals & Sales Logistics Channel">
    <meta name="keywords" content="Car Sale, Car Hire, Nigeria Auto, Lagos Car Rental">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{{ platform_config.business_name|default:"Corex Elite Autos" }}{% endblock %}</title>

    <!-- 🌌 FIXED: Google Fonts Matrix linked precisely to pull the clean Lato font family -->
    <link href="https://googleapis.com" rel="stylesheet">

    <!-- 🎨 Modern10 Core CSS Asset Injections with Shielded Directory Formats -->
    <link rel="stylesheet" href="{% static 'modern10/css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'modern10/css/font-awesome.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'modern10/css/elegant-icons.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'modern10/css/nice-select.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'modern10/css/magnific-popup.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'modern10/css/jquery-ui.min.css' %}" type="text/css">

    <!-- 🟢 FIXED LAYOUT ENGINE: Included the core styling elements required by owl-carousel! -->
    <link rel="stylesheet" href="{% static 'modern10/css/owl.carousel.min.css' %}" type="text/css">

    <link rel="stylesheet" href="{% static 'modern10/css/slicknav.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'modern10/css/style.css' %}" type="text/css">
</head>

<body>
    <!-- Page Preloader Engine -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <!-- 🎛️ DYNAMIC INJECTION WINDOW FOR CHILD VIEWS -->
    {% block master_content %}
    {% endblock master_content %}

    <!-- ⚡ Modern10 Javascript Infrastructure Execution Matrix -->
    <script src="{% static 'modern10/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'modern10/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'modern10/js/jquery.nice-select.min.js' %}"></script>
    <script src="{% static 'modern10/js/jquery-ui.min.js' %}"></script>
    <script src="{% static 'modern10/js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'modern10/js/mixitup.min.js' %}"></script>
    <script src="{% static 'modern10/js/jquery.slicknav.js' %}"></script>
    <script src="{% static 'modern10/js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'modern10/js/main.js' %}"></script>
</body>

</html>
